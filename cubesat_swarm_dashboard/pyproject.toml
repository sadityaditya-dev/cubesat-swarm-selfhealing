[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cubesat-swarm-sim"
version = "1.0.0"
description = "Integrated planar CubeSat swarm simulation with HCW dynamics, communications, recovery, coverage metrics and dashboard"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "matplotlib>=3.8"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["cubesat_swarm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
